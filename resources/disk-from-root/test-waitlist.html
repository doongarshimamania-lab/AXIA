<!DOCTYPE html>
<html>
<head>
    <title>Waitlist Test</title>
</head>
<body>
    <h1>Direct Waitlist Test</h1>
    <p id="status">Testing mutation...</p>
    <script type="module">
        import { ConvexHttpClient } from "https://cdn.jsdelivr.net/npm/convex@1.13.0/+esm";
        
        const convexUrl = "https://harmless-tapir-303.convex.cloud";
        const client = new ConvexHttpClient(convexUrl);
        
        try {
            const result = await client.mutation("waitlist:addToWaitlist", {
                email: "htmltest@example.com",
                source: "test"
            });
            document.getElementById("status").textContent = "Success: " + JSON.stringify(result);
        } catch (error) {
            document.getElementById("status").textContent = "Error: " + error.message;
            console.error(error);
        }
    </script>
</body>
</html>
